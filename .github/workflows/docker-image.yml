name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_TAG: commit_${{ github.sha }}
  STAGE_SERVICE_NAME: "aibrain"
  REMOTE_DIR: "/root/projects/aibrain"
  COMPOSE_FILE: "/root/projects/aibrain/docker-compose.yml"
  STAGE_ENV: ${{ vars.STAGE_ENV }}

jobs:
  build:
    runs-on: [ self-hosted, ideainyou ]
    # Must match a branch in the `on:` triggers above, or this job — and
    # deploy, which needs it — is silently skipped on every run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login ${{ secrets.DOCKER_REGISTRY_LOC }} -u $DOCKER_USERNAME --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY_LOC }}/${{ env.STAGE_SERVICE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

  deploy:
    runs-on: [ self-hosted, ideainyou ]
    needs: build
    steps:
      - name: Deploy to stage server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Passed through as remote shell variables rather than inlined into the
          # script — STAGE_ENV holds quotes and newlines that would break the
          # remote shell's own quoting if substituted as text.
          envs: STAGE_ENV,DOCKER_IMAGE_TAG,REMOTE_DIR,COMPOSE_FILE,STAGE_SERVICE_NAME,DOCKER_REGISTRY
          script: |
            set -e
            mkdir -p "$REMOTE_DIR"
            cd "$REMOTE_DIR"

            export DOCKER_IMAGE_TAG DOCKER_REGISTRY
            docker compose -f "$COMPOSE_FILE" pull "$STAGE_SERVICE_NAME"
            docker compose -f "$COMPOSE_FILE" up -d "$STAGE_SERVICE_NAME"
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY_LOC }}
